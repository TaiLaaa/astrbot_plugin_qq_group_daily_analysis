{% if image_summaries %}
<style>
/* 本区块位于报告外层的 12 栏网格中，必须占满整行；
   否则内部三列会被压缩在外层单个网格栏里。 */
.image-summary-section {
    grid-column: 1 / -1;
    width: 100%;
    min-width: 0;
}
.image-summary-grid {
    display: grid;
    /* 日报固定宽度下每行三张，避免单图独占整行 */
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-top: 14px;
}
.image-summary-card {
    min-width: 0;
    background: rgba(255,255,255,0.78);
    border: 2px solid rgba(90,70,50,0.16);
    border-radius: 14px;
    padding: 10px;
    box-shadow: 0 8px 18px rgba(80,60,40,0.09);
    overflow: hidden;
}
.image-summary-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-weight: 700;
    color: #5a4636;
}
.image-summary-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #f1e7d8;
}
.image-summary-pic {
    width: 100%;
    height: 130px;
    object-fit: cover;
    border-radius: 10px;
    display: block;
    margin-bottom: 8px;
    background: #f1e7d8;
}
.image-summary-desc {
    font-size: 13px;
    line-height: 1.45;
    color: #6b5847;
    word-break: break-word;
}
</style>
<section class="image-summary-section">
    <h2 class="section-title">🖼️ 图片锐评</h2>
    <div class="image-summary-grid">
        {% for item in image_summaries %}
        <div class="image-summary-card">
            <div class="image-summary-header">
                {% if item.avatar_url %}<img class="image-summary-avatar" src="{{ item.avatar_url }}" alt="avatar">{% endif %}
                <span>{{ item.sender or item.sender_id or '群友' }}</span>
            </div>
            {% if item.url %}<img class="image-summary-pic" src="{{ item.url }}" alt="image summary" onerror="this.style.display='none'">{% endif %}
            {% if item.description %}<div class="image-summary-desc">{{ item.description }}</div>{% endif %}
        </div>
        {% endfor %}
    </div>
</section>
{% endif %}
