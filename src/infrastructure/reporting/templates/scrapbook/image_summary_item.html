{% if image_summaries %}
<style>
.image-summary-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 18px;
    margin-top: 18px;
}
.image-summary-card {
    background: rgba(255,255,255,0.78);
    border: 2px solid rgba(90,70,50,0.16);
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 10px 24px rgba(80,60,40,0.10);
    overflow: hidden;
}
.image-summary-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-weight: 700;
    color: #5a4636;
}
.image-summary-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    background: #f1e7d8;
}
.image-summary-pic {
    width: 100%;
    max-height: 220px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    margin-bottom: 10px;
}
.image-summary-desc {
    font-size: 14px;
    line-height: 1.55;
    color: #6b5847;
    word-break: break-word;
}
</style>
<section class="image-summary-section">
    <h2 class="section-title">🖼️ 图片锐评</h2>
    <div class="image-summary-grid">
        {% for item in image_summaries %}
        <div class="image-summary-card">
            <div class="image-summary-header">
                {% if item.avatar_url %}<img class="image-summary-avatar" src="{{ item.avatar_url }}" alt="avatar">{% endif %}
                <span>{{ item.sender or item.sender_id or '群友' }}</span>
            </div>
            {% if item.url %}<img class="image-summary-pic" src="{{ item.url }}" alt="image summary">{% endif %}
            {% if item.description %}<div class="image-summary-desc">{{ item.description }}</div>{% endif %}
        </div>
        {% endfor %}
    </div>
</section>
{% endif %}
